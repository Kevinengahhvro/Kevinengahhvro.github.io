
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Retro Cherenkov Sim</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'VT323', monospace;
      background: #000;
      color: #00ffff;
      overflow: hidden;
    }

    button {
      font-family: 'VT323', monospace;
      font-size: 20px;
      padding: 10px 20px;
      margin: 30px;
      background: #000;
      border: 2px solid #00ffff;
      color: #00ffff;
      cursor: pointer;
    }

    button:hover {
      background: #00ffff;
      color: #000;
    }

    .draggable-window {
      position: fixed;
      top: 80px;
      left: 80px;
      width: 900px;
      height: 600px;
      background: #000;
      border: 3px solid #00ffff;
      box-shadow: 0 0 20px #00ffff;
      display: flex;
      flex-direction: column;
      z-index: 9999;
    }

    .title-bar {
      background: #001f2f;
      padding: 10px;
      color: #00ffff;
      display: flex;
      justify-content: space-between;
      cursor: move;
      font-size: 20px;
    }

    .title-bar button {
      background: #00ffff;
      color: #000;
      border: none;
      font-weight: bold;
      padding: 0 10px;
      cursor: pointer;
      font-size: 18px;
    }

    #threeContainer {
      flex: 1;
    }

    #ui {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 50, 50, 0.9);
      padding: 10px;
      font-size: 18px;
    }

    input[type=range] {
      width: 150px;
    }
  </style>
</head>
<body>

<button id="launchBtn">⚛️ Launch Cherenkov Simulator</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/controls/OrbitControls.min.js"></script>

<script>
document.getElementById('launchBtn').addEventListener('click', openCherenkovSim);

function openCherenkovSim() {
  if (document.querySelector('.draggable-window')) return;

  const win = document.createElement('div');
  win.className = 'draggable-window';
  win.innerHTML = `
    <div class="title-bar">
      ⚛️ 3D Cherenkov Simulator
      <button onclick="this.closest('.draggable-window').remove()">X</button>
    </div>
    <div id="threeContainer" style="position:relative;flex:1;"></div>
  `;
  document.body.appendChild(win);

  const title = win.querySelector('.title-bar');
  let isDragging = false, dx, dy;
  title.onmousedown = e => {
    isDragging = true;
    dx = e.clientX - win.offsetLeft;
    dy = e.clientY - win.offsetTop;
  };
  document.onmouseup = () => isDragging = false;
  document.onmousemove = e => {
    if (isDragging) {
      win.style.left = \`\${e.clientX - dx}px\`;
      win.style.top = \`\${e.clientY - dy}px\`;
    }
  };

  const container = win.querySelector('#threeContainer');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 10, 50);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0x222222));
  const light = new THREE.PointLight(0x00ffff, 1.5);
  light.position.set(20, 20, 20);
  scene.add(light);

  const electron = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0x00ffff })
  );
  scene.add(electron);

  const cone = new THREE.Mesh(
    new THREE.ConeGeometry(1, 1, 32, 1, true),
    new THREE.MeshPhongMaterial({ color: 0x3399ff, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
  );
  cone.rotation.z = Math.PI;
  scene.add(cone);

  const mols = new THREE.Group();
  const oMat = new THREE.MeshPhongMaterial({ color: 0xff0000 });
  const hMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
  const bond = 1;
  const angle = 104.5 * Math.PI / 180;
  for (let x = -3; x <= 3; x++) {
    for (let y = -2; y <= 2; y++) {
      const mol = new THREE.Group();
      const o = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), oMat);
      const h1 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), hMat);
      const h2 = h1.clone();
      h1.position.set(bond * Math.cos(-angle / 2), bond * Math.sin(-angle / 2), 0);
      h2.position.set(bond * Math.cos(angle / 2), bond * Math.sin(angle / 2), 0);
      mol.add(o, h1, h2);
      mol.position.set(x * 6, y * 6, 0);
      mols.add(mol);
    }
  }
  scene.add(mols);

  const ui = document.createElement('div');
  ui.id = 'ui';
  ui.innerHTML = \`Speed (β): <input type="range" min="0.5" max="0.99" step="0.01" value="0.8" id="betaSlider"> <span id="betaVal">0.80</span>\`;
  container.appendChild(ui);

  const betaSlider = ui.querySelector('#betaSlider');
  const betaVal = ui.querySelector('#betaVal');
  let beta = 0.8;

  betaSlider.oninput = () => {
    beta = parseFloat(betaSlider.value);
    betaVal.textContent = beta.toFixed(2);
  };

  let start = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    const t = (performance.now() - start) / 1000;
    const n = 1.33;
    const v = beta;
    electron.position.x = t * 10;

    if (v * n > 1) {
      const theta = Math.acos(1 / (v * n));
      const length = electron.position.x;
      const radius = length * Math.tan(theta);
      cone.scale.set(radius, length, radius);
      cone.position.copy(electron.position);
      cone.rotation.x = theta;
      cone.visible = true;
    } else {
      cone.visible = false;
    }

    mols.children.forEach(mol => {
      mol.lookAt(electron.position);
      mol.rotation.x += (-mol.rotation.x) * 0.1;
    });

    controls.update();
    renderer.render(scene, camera);
  }

  animate();
}
</script>

</body>
</html>
