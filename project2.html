<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Year 10 USYD Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'VT323', monospace;
      font-size: 20px;
      background: #000;
      color: #00ffff;
      height: auto;
      overflow-y: auto;
    }

    #arrow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 40px;
      max-width: 800px;
      margin: auto;
    }

    h1, h2 {
      border-bottom: 1px solid #00ff00;
      padding-bottom: 5px;
    }

    .file-icon {
      margin-top: 10px;
      cursor: pointer;
      display: inline-block;
    }

    .file-icon img {
      width: 200px;
      border: 1px solid #00ff00;
    }

    .draggable-window {
      position: absolute;
      top: 120px;
      left: 120px;
      width: 500px;
      background: #000;
      border: 2px solid #00ff00;
      box-shadow: 0 0 15px #00ff00;
      z-index: 1000;
    }

    .title-bar {
      background: #003300;
      padding: 5px 10px;
      font-weight: bold;
      color: #00ff00;
      display: flex;
      justify-content: space-between;
      cursor: move;
    }

    .window-content {
      padding: 10px;
      max-height: 400px;
      overflow: auto;
    }

    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #00ff00;
      border-radius: 6px;
      border: 2px solid #003300;
      box-shadow: 0 0 5px #00ff00;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #33ff33;
    }
  </style>
</head>
<body>

<canvas id="arrow-canvas"></canvas>

<div class="content">
  <h1> Year 11 ANSTO's OPAL Reactor Cherenkov Radiation analysis </h1>
  <p> 
  </p>
<button onclick="openCherenkovSim()">⚛️ Launch Cherenkov Simulator</button>

<script>
function openCherenkovSim() {
  // Prevent multiple windows
  if (document.querySelector('.draggable-window')) return;

  const simWin = document.createElement('div');
  simWin.className = 'draggable-window';
  simWin.style.width = '600px';
  simWin.style.height = '400px';
  simWin.style.top = '50px';
  simWin.style.left = '50px';
  simWin.style.background = '#000';
  simWin.style.border = '2px solid #00ffff';
  simWin.style.boxShadow = '0 0 20px #00ffff';
  simWin.style.position = 'fixed';
  simWin.style.zIndex = 9999;
  simWin.style.display = 'flex';
  simWin.style.flexDirection = 'column';

  simWin.innerHTML = `
    <div class="title-bar" style="background:#003333; color:#00ffff; padding:8px 12px; font-family: 'VT323', monospace; font-weight:bold; cursor: move; display:flex; justify-content: space-between; align-items:center;">
      <span>⚡ Cherenkov Radiation Simulator</span>
      <button id="closeSim" style="background:#00ffff; border:none; color:#000; font-weight:bold; padding:4px 10px; cursor:pointer;">X</button>
    </div>
    <canvas id="cherenkovCanvas" style="flex-grow:1; display:block;"></canvas>
    <div style="padding:10px; background:#002222; font-family: 'VT323', monospace; color:#00ffff;">
      Speed: <input type="range" id="speedSlider" min="2" max="20" value="8" step="0.1" style="vertical-align: middle; width: 300px;">
      <span id="speedVal" style="margin-left:10px;">8.0</span>
    </div>
  `;

  document.body.appendChild(simWin);

  // Draggable logic
  const titleBar = simWin.querySelector('.title-bar');
  const closeBtn = simWin.querySelector('#closeSim');

  closeBtn.onclick = () => simWin.remove();

  let isDragging = false, offsetX = 0, offsetY = 0;
  titleBar.addEventListener('mousedown', e => {
    isDragging = true;
    offsetX = e.clientX - simWin.getBoundingClientRect().left;
    offsetY = e.clientY - simWin.getBoundingClientRect().top;
  });
  document.addEventListener('mouseup', () => isDragging = false);
  document.addEventListener('mousemove', e => {
    if (!isDragging) return;
    let left = e.clientX - offsetX;
    let top = e.clientY - offsetY;
    // Keep window in viewport
    left = Math.min(window.innerWidth - simWin.offsetWidth, Math.max(0, left));
    top = Math.min(window.innerHeight - simWin.offsetHeight, Math.max(0, top));
    simWin.style.left = left + 'px';
    simWin.style.top = top + 'px';
  });

  // Canvas setup
  const canvas = simWin.querySelector('#cherenkovCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    const rect = simWin.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height - titleBar.offsetHeight - simWin.querySelector('div').offsetHeight;
  }
  resizeCanvas();
  new ResizeObserver(resizeCanvas).observe(simWin);

  // Water molecules grid
  const waterMolecules = [];
  const spacing = 110;
  for (let x = 50; x < canvas.width; x += spacing) {
    for (let y = 50; y < canvas.height; y += spacing) {
      waterMolecules.push({ x, y, angle: 0, originalAngle: 0 });
    }
  }

  // Electrons list
  const electrons = [];

  // Speed slider and label
  const speedSlider = simWin.querySelector('#speedSlider');
  const speedVal = simWin.querySelector('#speedVal');
  let electronSpeed = parseFloat(speedSlider.value);
  speedVal.textContent = electronSpeed.toFixed(1);
  speedSlider.oninput = () => {
    electronSpeed = parseFloat(speedSlider.value);
    speedVal.textContent = electronSpeed.toFixed(1);
  };

  // On canvas click, spawn electron
  canvas.addEventListener('click', e => {
    const rect = canvas.getBoundingClientRect();
    electrons.push({
      startX: e.clientX - rect.left,
      x: e.clientX - rect.left,
      y: e.clientY - rect.top,
      vx: electronSpeed,
      alpha: 1,
      trail: [],
      coneAngle: Math.PI / 8 // Cherenkov cone half-angle approx
    });
  });

  // Draw Cherenkov cone BEHIND electron moving to the right
  function drawCone(el) {
    const dist = el.x - el.startX;
    if (dist <= 0) return; // no cone if electron hasn't moved forward yet
    const coneLength = dist;
    const coneWidth = coneLength * Math.tan(el.coneAngle);

    ctx.save();
    ctx.translate(el.x, el.y);
    ctx.rotate(Math.PI); // flip to point backward (left)
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(coneLength, -coneWidth);
    ctx.lineTo(coneLength, coneWidth);
    ctx.closePath();

    const grad = ctx.createLinearGradient(0, 0, coneLength, 0);
    grad.addColorStop(0, 'rgba(0,200,255,0.7)');
    grad.addColorStop(1, 'rgba(0,100,255,0)');
    ctx.fillStyle = grad;
    ctx.shadowColor = 'rgba(0,200,255,0.5)';
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.restore();
  }

  // Draw electron trail
  function drawElectronTrail(el) {
    el.trail.push({ x: el.x, y: el.y, alpha: el.alpha });
    if (el.trail.length > 50) el.trail.shift();

    el.trail.forEach((t, i) => {
      const grad = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 12);
      grad.addColorStop(0, `rgba(0,200,255,${t.alpha * (i / el.trail.length) * 0.6})`);
      grad.addColorStop(1, 'rgba(0,0,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(t.x, t.y, 8 * (i / el.trail.length), 0, 2 * Math.PI);
      ctx.fill();
    });
  }

  // Draw water molecule with proper O (red) and H (white) atoms, bond angle ~104.5°
  function drawWaterMolecule(mol, electrons) {
    let facing = false;
    for (const el of electrons) {
      const dx = el.x - mol.x;
      const dy = el.y - mol.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        mol.angle = Math.atan2(dy, dx);
        facing = true;
        break;
      }
    }
    if (!facing) mol.angle += (mol.originalAngle - mol.angle) * 0.1;

    ctx.save();
    ctx.translate(mol.x, mol.y);
    ctx.rotate(mol.angle);

    // Oxygen (red circle)
    ctx.fillStyle = 'red';
    ctx.beginPath();
    ctx.arc(0, 0, 10, 0, Math.PI * 2);
    ctx.fill();

    // Hydrogens (white circles)
    const bondLength = 18;
    const bondAngle = 104.5 * Math.PI / 180;
    const h1x = Math.cos(-bondAngle / 2) * bondLength;
    const h1y = Math.sin(-bondAngle / 2) * bondLength;
    const h2x = Math.cos(bondAngle / 2) * bondLength;
    const h2y = Math.sin(bondAngle / 2) * bondLength;

    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(h1x, h1y, 6, 0, Math.PI * 2);
    ctx.arc(h2x, h2y, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Main animation loop
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw molecules first (behind)
    waterMolecules.forEach(mol => drawWaterMolecule(mol, electrons));

    // Draw electrons and cones
    for (let i = electrons.length - 1; i >= 0; i--) {
      const el = electrons[i];
      drawCone(el);
      drawElectronTrail(el);

      el.x += el.vx;
      el.alpha -= 0.006;

      if (el.alpha <= 0 || el.x > canvas.width + 50) {
        electrons.splice(i, 1);
      }
    }

    requestAnimationFrame(animate);
  }

  animate();
}
</script>

<script>
  const canvas = document.getElementById('arrow-canvas');
  const ctx = canvas.getContext('2d');
  let mouse = { x: null, y: null };
  let arrows = [];
  const spacing = 20;
  const arrowSize = 6;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    init();
  });

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  class Arrow {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.angle = Math.PI / 2;
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.beginPath();
      ctx.moveTo(-arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 4, -arrowSize / 4);
      ctx.moveTo(arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 4, arrowSize / 4);
      const distance = this.getDistanceToMouse();
      const maxDist = 150;
      const clampedDist = Math.min(distance, maxDist);
      const ratio = 1 - clampedDist / maxDist;
      const red = Math.floor(ratio * 255);
      const green = Math.floor((1 - ratio) * 255);
      ctx.strokeStyle = `rgb(${red}, ${green}, 0)`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    update() {
      if (mouse.x === null || mouse.y === null) {
        this.angle += (Math.PI / 2 - this.angle) * 0.05;
        return;
      }
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      let distance = Math.sqrt(dx * dx + dy * dy);
      const maxDist = 150;
      if (distance < maxDist) {
        let targetAngle = Math.atan2(dy, dx);
        let influence = (maxDist - distance) / maxDist;
        this.angle += (targetAngle - this.angle) * influence * 0.3;
      } else {
        this.angle += (Math.PI / 2 - this.angle) * 0.05;
      }
    }

    getDistanceToMouse() {
      if (mouse.x === null || mouse.y === null) return Infinity;
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      return Math.sqrt(dx * dx + dy * dy);
    }
  }

  function init() {
    arrows = [];
    for (let x = 0; x < canvas.width; x += spacing) {
      for (let y = 0; y < canvas.height; y += spacing) {
        arrows.push(new Arrow(x, y));
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    arrows.forEach(a => {
      a.update();
      a.draw();
    });
    requestAnimationFrame(animate);
  }

  init();
  animate();

  function openWindow(type, title, content) {
    const win = document.createElement('div');
    win.className = 'draggable-window ' + type;
    win.innerHTML = `
      <div class="title-bar">
        <span>${title}</span>
        <button onclick="this.closest('.draggable-window').remove()">X</button>
      </div>
      <div class="window-content">${content}</div>
    `;
    document.body.appendChild(win);

    const titleBar = win.querySelector('.title-bar');
    let isDragging = false, offsetX = 0, offsetY = 0;

    titleBar.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.clientX - win.offsetLeft;
      offsetY = e.clientY - win.offsetTop;
    });

    document.addEventListener('mouseup', () => isDragging = false);
    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.top = (e.clientY - offsetY) + 'px';
      }
    });
  }
</script>
</body>
