<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Year 10 USYD Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'VT323', monospace;
      font-size: 20px;
      background: #000;
      color: #00ffff;
      height: auto;
      overflow-y: auto;
    }

    #arrow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 40px;
      max-width: 800px;
      margin: auto;
    }

    h1, h2 {
      border-bottom: 1px solid #00ff00;
      padding-bottom: 5px;
    }

    .file-icon {
      margin-top: 10px;
      cursor: pointer;
      display: inline-block;
    }

    .file-icon img {
      width: 200px;
      border: 1px solid #00ff00;
    }

    .draggable-window {
      position: absolute;
      top: 120px;
      left: 120px;
      width: 500px;
      background: #000;
      border: 2px solid #00ff00;
      box-shadow: 0 0 15px #00ff00;
      z-index: 1000;
    }

    .title-bar {
      background: #003300;
      padding: 5px 10px;
      font-weight: bold;
      color: #00ff00;
      display: flex;
      justify-content: space-between;
      cursor: move;
    }

    .window-content {
      padding: 10px;
      max-height: 400px;
      overflow: auto;
    }

    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #00ff00;
      border-radius: 6px;
      border: 2px solid #003300;
      box-shadow: 0 0 5px #00ff00;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #33ff33;
    }
  </style>
</head>
<body>

<canvas id="arrow-canvas"></canvas>

<div class="content">
  <h1> Year 11 ANSTO's OPAL Reactor Cherenkov Radiation analysis </h1>
  <p> 
  </p>
<button id="launchSimBtn">⚛️ Launch Cherenkov Simulator</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/controls/OrbitControls.min.js"></script>

<script>
(() => {
  let simWin, scene, camera, renderer, controls;
  let moleculesGroup, electron, cone;
  let betaSlider, betaVal, wireframeElectronCB, wireframeConeCB;
  let beta = 0.8;
  const n = 1.33; // Refractive index of water
  const particles = [];
  const polarisationArrows = [];
  let animationId;

  const electronMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
  const electronWireframeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });
  const coneMat = new THREE.MeshPhongMaterial({ color: 0x3399ff, opacity: 0.6, transparent: true, side: THREE.DoubleSide });
  const coneWireframeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.8 });

  // Create a polarisation arrow helper (small blue arrow)
  function createPolarisationArrow(angle) {
    const dir = new THREE.Vector3(1, 0, 0);
    const origin = new THREE.Vector3(0, 0, 0);
    const length = 2;
    const color = 0x00ffff;
    const arrow = new THREE.ArrowHelper(dir, origin, length, color);
    return arrow;
  }

  function spawnPhotonParticle() {
    if (!scene) return;
    const geometry = new THREE.SphereGeometry(0.1, 8, 8);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ccff, transparent: true, opacity: 0.7 });
    const particle = new THREE.Mesh(geometry, material);
    particle.position.copy(electron.position);
    particle.position.x -= 1 + Math.random() * 0.5;
    particle.life = 1;
    scene.add(particle);
    particles.push(particle);
  }

  function openCherenkovSim() {
    if (document.querySelector('.draggable-window')) return;

    // Popup window
    simWin = document.createElement('div');
    simWin.className = 'draggable-window';
    simWin.innerHTML = `
      <div class="title-bar">
        ⚛️ 3D Cherenkov Simulator
        <button id="close3d">X</button>
      </div>
      <div id="threeContainer"></div>
      <div id="uiPanel">
        Speed (β): <input type="range" id="betaSlider" min="0.5" max="0.99" step="0.01" value="${beta}">
        <span id="betaVal">${beta.toFixed(2)}</span><br><br>
        <label>Electron Wireframe <input type="checkbox" id="wireframeElectron"></label>
        <label>Cone Wireframe <input type="checkbox" id="wireframeCone"></label>
      </div>
    `;
    document.body.appendChild(simWin);

    // Close button
    simWin.querySelector('#close3d').onclick = () => {
      cancelAnimationFrame(animationId);
      window.removeEventListener('resize', onWindowResize);
      if(renderer) {
        renderer.dispose();
        renderer.forceContextLoss();
        renderer.domElement = null;
        renderer = null;
      }
      if(scene) {
        scene.clear();
        scene = null;
      }
      simWin.remove();
    };

    // Draggable window logic
    const title = simWin.querySelector('.title-bar');
    let dragging = false, dx=0, dy=0;
    title.addEventListener('mousedown', e => {
      dragging = true; dx = e.clientX - simWin.offsetLeft; dy = e.clientY - simWin.offsetTop;
    });
    document.addEventListener('mouseup', () => dragging = false);
    document.addEventListener('mousemove', e => {
      if (dragging) {
        simWin.style.left = Math.max(0, Math.min(window.innerWidth - simWin.offsetWidth, e.clientX - dx)) + 'px';
        simWin.style.top = Math.max(0, Math.min(window.innerHeight - simWin.offsetHeight, e.clientY - dy)) + 'px';
      }
    });

    const container = simWin.querySelector('#threeContainer');
    container.style.width = '100%';
    container.style.height = '100%';
    container.style.flex = '1';

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Scene and Camera
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, container.clientWidth/container.clientHeight, 0.1, 1000);
    camera.position.set(0, 20, 60);

    // OrbitControls for drag/zoom
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 10;
    controls.maxDistance = 200;

    // Lights
    const light = new THREE.PointLight(0x00ffff, 1.2);
    light.position.set(50, 50, 50);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x222222));

    // Water molecules grid 3D (7 x 5 grid, z=0)
    moleculesGroup = new THREE.Group();
    const oMat = new THREE.MeshPhongMaterial({ color: 0xff0d0d });
    const hMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
    for(let i = -3; i <= 3; i++) {
      for(let j = -2; j <= 2; j++) {
        const mol = new THREE.Object3D();
        const ox = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), oMat);
        mol.add(ox);

        const bondAngle = 104.5 * Math.PI/180;
        const r = 1;

        const h1 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), hMat);
        const h2 = h1.clone();
        h1.position.set(r * Math.cos(-bondAngle/2), r * Math.sin(-bondAngle/2), 0);
        h2.position.set(r * Math.cos(bondAngle/2), r * Math.sin(bondAngle/2), 0);
        mol.add(h1, h2);

        mol.position.set(i*6, j*6, 0);
        moleculesGroup.add(mol);
      }
    }
    scene.add(moleculesGroup);

    // Electron
    electron = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), electronMat);
    scene.add(electron);

    // Cherenkov Cone
    const coneGeom = new THREE.ConeGeometry(1, 1, 32, 1, true);
    cone = new THREE.Mesh(coneGeom, coneMat);
    cone.rotation.z = Math.PI;
    cone.position.set(0,0,0);
    scene.add(cone);

    // Polarisation arrows (10 arrows)
    for(let k=0; k<10; k++) {
      const arrow = createPolarisationArrow(0);
      polarisationArrows.push(arrow);
      scene.add(arrow);
    }

    // UI bindings
    betaSlider = simWin.querySelector('#betaSlider');
    betaVal = simWin.querySelector('#betaVal');
    wireframeElectronCB = simWin.querySelector('#wireframeElectron');
    wireframeConeCB = simWin.querySelector('#wireframeCone');

    betaSlider.value = beta;
    betaVal.textContent = beta.toFixed(2);

    betaSlider.oninput = () => {
      beta = parseFloat(betaSlider.value);
      betaVal.textContent = beta.toFixed(2);
    };

    wireframeElectronCB.onchange = () => {
      electron.material = wireframeElectronCB.checked ? electronWireframeMat : electronMat;
    };

    wireframeConeCB.onchange = () => {
      cone.material = wireframeConeCB.checked ? coneWireframeMat : coneMat;
    };

    window.addEventListener('resize', onWindowResize);

    animate();
  }

  function animate() {
    animationId = requestAnimationFrame(animate);

    const time = performance.now() * 0.001;

    // Move electron along X at speed proportional to beta
    electron.position.set(time * 10 * beta, 0, 0);

    // Calculate Cherenkov angle if beta*n >1
    if(beta * n > 1) {
      const theta = Math.acos(1 / (beta * n));
      cone.rotation.set(theta, Math.PI/2, Math.PI);

      const length = electron.position.x;
      const radius = length * Math.tan(theta);
      cone.scale.set(radius, length, radius);
      cone.position.copy(electron.position);
      cone.visible = true;

      // Spin polarisation arrows around cone base circle
      polarisationArrows.forEach((arrow, i) => {
        const spinSpeed = 2; // rad/sec
        const baseRadius = length * Math.tan(theta);
        const angle = (performance.now() * 0.002 + (i / polarisationArrows.length) * Math.PI * 2) * spinSpeed;
        arrow.position.set(
          electron.position.x,
          baseRadius * Math.cos(angle),
          baseRadius * Math.sin(angle)
        );
        arrow.setDirection(new THREE.Vector3(1, 0, 0));
      });
    } else {
      cone.visible = false;
      polarisationArrows.forEach(arrow => arrow.position.set(0, -9999, 0)); // hide offscreen
    }

    // Molecules rotate to face electron, then relax
    moleculesGroup.children.forEach(mol => {
      mol.lookAt(electron.position);
      mol.rotation.x += (-mol.rotation.x) * 0.05;
      mol.rotation.y += (-mol.rotation.y) * 0.05;
      mol.rotation.z += (-mol.rotation.z) * 0.05;
    });

    // Spawn photon particles trailing electron randomly
    if(Math.random() < 0.1) spawnPhotonParticle();

    // Animate particles
    for(let i=particles.length-1; i>=0; i--) {
      const p = particles[i];
      p.position.x += 0.15;
      p.material.opacity -= 0.01;
      p.life -= 0.01;
      if(p.life <= 0) {
        scene.remove(p);
        particles.splice(i, 1);
      }
    }

    controls.update();
    renderer.render(scene, camera);
  }

  function onWindowResize() {
    if(!renderer) return;
    const container = simWin.querySelector('#threeContainer');
    const width = container.clientWidth;
    const height = container.clientHeight;
    camera.aspect = width/height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  }

  document.getElementById('launchSimBtn').onclick = openCherenkovSim;
})();
</script>
</body>
</html>
