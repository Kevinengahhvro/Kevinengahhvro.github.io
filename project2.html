<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Year 10 USYD Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'VT323', monospace;
      font-size: 20px;
      background: #000;
      color: #00ffff;
      height: auto;
      overflow-y: auto;
    }

    #arrow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 40px;
      max-width: 800px;
      margin: auto;
    }

    h1, h2 {
      border-bottom: 1px solid #00ff00;
      padding-bottom: 5px;
    }

    .file-icon {
      margin-top: 10px;
      cursor: pointer;
      display: inline-block;
    }

    .file-icon img {
      width: 200px;
      border: 1px solid #00ff00;
    }

    .draggable-window {
      position: absolute;
      top: 120px;
      left: 120px;
      width: 500px;
      background: #000;
      border: 2px solid #00ff00;
      box-shadow: 0 0 15px #00ff00;
      z-index: 1000;
    }

    .title-bar {
      background: #003300;
      padding: 5px 10px;
      font-weight: bold;
      color: #00ff00;
      display: flex;
      justify-content: space-between;
      cursor: move;
    }

    .window-content {
      padding: 10px;
      max-height: 400px;
      overflow: auto;
    }

    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #00ff00;
      border-radius: 6px;
      border: 2px solid #003300;
      box-shadow: 0 0 5px #00ff00;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #33ff33;
    }
  </style>
</head>
<body>

<canvas id="arrow-canvas"></canvas>

<div class="content">
  <h1> Year 11 ANSTO's OPAL Reactor Cherenkov Radiation analysis </h1>
  <p> 
  </p>
<button id="launchSimBtn" style="position: fixed; top:10px; left:10px; z-index: 11000; font-family:'VT323'; font-size:18px; background:#000; border:2px solid #00ff00; color:#00ff00; padding:6px 12px; cursor:pointer;">
  ⚛️ Launch Cherenkov Simulator
</button>

<script>
(() => {
  const n = 1.33; // refractive index of water

  let simWin, canvas, ctx, width, height;
  let molecules = [];
  const molSpacing = 60;
  const molRadius = 10;
  let electron = null; // {x, y, speed, active, startX}
  let beta = 0.8;

  function createWindow() {
    simWin = document.createElement('div');
    simWin.className = 'draggable-window';
    simWin.innerHTML = `
      <div class="title-bar">
        <span>⚛️ 2D Cherenkov Simulator</span>
        <button id="closeBtn">X</button>
      </div>
      <div class="window-content">
        <canvas id="simCanvas"></canvas>
        <div id="controls">
          <label for="betaRange">Speed (β):</label>
          <input type="range" id="betaRange" min="${(1/n).toFixed(3)}" max="0.99" step="0.005" value="${beta.toFixed(3)}"/>
          <span id="betaValue">${beta.toFixed(3)}</span>
        </div>
      </div>
    `;
    document.body.appendChild(simWin);

    canvas = simWin.querySelector('#simCanvas');
    ctx = canvas.getContext('2d');
    resizeCanvas();

    simWin.querySelector('#closeBtn').onclick = () => simWin.remove();

    const titleBar = simWin.querySelector('.title-bar');
    let dragging = false, offsetX = 0, offsetY = 0;

    titleBar.addEventListener('mousedown', e => {
      dragging = true;
      offsetX = e.clientX - simWin.offsetLeft;
      offsetY = e.clientY - simWin.offsetTop;
    });
    window.addEventListener('mouseup', () => dragging = false);
    window.addEventListener('mousemove', e => {
      if (dragging) {
        let newX = e.clientX - offsetX;
        let newY = e.clientY - offsetY;
        newX = Math.min(Math.max(newX, 0), window.innerWidth - simWin.offsetWidth);
        newY = Math.min(Math.max(newY, 0), window.innerHeight - simWin.offsetHeight);
        simWin.style.left = newX + 'px';
        simWin.style.top = newY + 'px';
      }
    });

    const betaRange = simWin.querySelector('#betaRange');
    const betaValue = simWin.querySelector('#betaValue');

    betaRange.oninput = e => {
      beta = parseFloat(e.target.value);
      betaValue.textContent = beta.toFixed(3);
    };

    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      electron = {
        x: x,
        y: y,
        startX: x,
        speed: beta * 300, // pixels per second
        active: true,
        launchTime: performance.now()
      };
    });

    initMolecules();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function resizeCanvas() {
    width = simWin.querySelector('.window-content').clientWidth;
    height = simWin.querySelector('.window-content').clientHeight;
    canvas.width = width * devicePixelRatio;
    canvas.height = height * devicePixelRatio;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(devicePixelRatio, devicePixelRatio);
  }

  function initMolecules() {
    molecules = [];
    const cols = Math.floor(width / molSpacing);
    const rows = Math.floor(height / molSpacing);
    for(let i = 0; i <= cols; i++) {
      for(let j = 0; j <= rows; j++) {
        molecules.push({
          x: i * molSpacing + molSpacing/2,
          y: j * molSpacing + molSpacing/2,
          angle: 0,
          targetAngle: 0
        });
      }
    }
  }

  function drawMolecule(mol) {
    ctx.save();
    ctx.translate(mol.x, mol.y);
    ctx.rotate(mol.angle);

    // Oxygen atom
    ctx.fillStyle = '#ff0000';
    ctx.beginPath();
    ctx.arc(0, 0, molRadius, 0, Math.PI * 2);
    ctx.fill();

    // Hydrogens
    ctx.fillStyle = '#fff';
    const bondAngle = 104.5 * Math.PI / 180;
    const r = molRadius * 0.6;
    ctx.beginPath();
    ctx.arc(r * Math.cos(-bondAngle/2), r * Math.sin(-bondAngle/2), molRadius * 0.3, 0, Math.PI * 2);
    ctx.arc(r * Math.cos(bondAngle/2), r * Math.sin(bondAngle/2), molRadius * 0.3, 0, Math.PI * 2);
    ctx.fill();

    // Dipole arrow line
    ctx.strokeStyle = '#00ff00';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(r * Math.cos(0), r * Math.sin(0));
    ctx.stroke();

    ctx.restore();
  }

  function drawCone(electron) {
    if (!electron.active) return;
    const theta = Math.acos(1 / (beta * n));
    if (isNaN(theta)) return;
    const length = electron.x - electron.startX;
    if (length <= 0) return;
    const halfBase = length * Math.tan(theta);

    ctx.save();
    ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
    ctx.strokeStyle = '#00ffff';
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(electron.x, electron.y);
    ctx.lineTo(electron.x - length, electron.y - halfBase);
    ctx.lineTo(electron.x - length, electron.y + halfBase);
    ctx.closePath();

    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function updateMolecules() {
    molecules.forEach(mol => {
      if (!electron || !electron.active) mol.targetAngle = 0;
      else {
        const dx = electron.x - mol.x;
        const dy = electron.y - mol.y;
        mol.targetAngle = Math.atan2(dy, dx);
      }
      let diff = mol.targetAngle - mol.angle;
      if (diff > Math.PI) diff -= 2 * Math.PI;
      if (diff < -Math.PI) diff += 2 * Math.PI;
      mol.angle += diff * 0.05;
    });
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    molecules.forEach(drawMolecule);

    if (electron && electron.active) {
      ctx.save();
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#0ff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(electron.x, electron.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      drawCone(electron);
    }
  }

  function updateElectron(deltaTime) {
    if (!electron || !electron.active) return;
    electron.x += electron.speed * deltaTime;
    if (electron.x > width + 50) electron.active = false;
  }

  let lastTime = 0;
  function loop(time) {
    if (!lastTime) lastTime = time;
    const deltaTime = (time - lastTime) / 1000;
    lastTime = time;

    updateElectron(deltaTime);
    updateMolecules();
    draw();

    requestAnimationFrame(loop);
  }

  document.getElementById('launchSimBtn').addEventListener('click', () => {
    if (document.querySelector('.draggable-window')) return;
    createWindow();
  });

  window.addEventListener('resize', () => {
    if (!simWin) return;
    resizeCanvas();
    initMolecules();
  });
})();
</script>
</body>
</html>
