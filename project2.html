<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Year 10 USYD Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'VT323', monospace;
      font-size: 20px;
      background: #000;
      color: #00ffff;
      height: auto;
      overflow-y: auto;
    }

    #arrow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 40px;
      max-width: 800px;
      margin: auto;
    }

    h1, h2 {
      border-bottom: 1px solid #00ff00;
      padding-bottom: 5px;
    }

    .file-icon {
      margin-top: 10px;
      cursor: pointer;
      display: inline-block;
    }

    .file-icon img {
      width: 200px;
      border: 1px solid #00ff00;
    }

    .draggable-window {
      position: absolute;
      top: 120px;
      left: 120px;
      width: 500px;
      background: #000;
      border: 2px solid #00ff00;
      box-shadow: 0 0 15px #00ff00;
      z-index: 1000;
    }

    .title-bar {
      background: #003300;
      padding: 5px 10px;
      font-weight: bold;
      color: #00ff00;
      display: flex;
      justify-content: space-between;
      cursor: move;
    }

    .window-content {
      padding: 10px;
      max-height: 400px;
      overflow: auto;
    }

    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #00ff00;
      border-radius: 6px;
      border: 2px solid #003300;
      box-shadow: 0 0 5px #00ff00;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #33ff33;
    }
  </style>
</head>
<body>

<canvas id="arrow-canvas"></canvas>

<div class="content">
  <h1> Year 11 ANSTO's OPAL Reactor Cherenkov Radiation analysis </h1>
  <p> 
  </p>
  <button id="launchSimBtn">⚛️ Launch Cherenkov Simulator</button>
  <p><a href="projects.html" style="color:#0ff; text-decoration:none;">← Back to Projects</a></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/controls/OrbitControls.min.js"></script>

<script>
(() => {
  const n = 1.33; // refractive index of water
  let simWin, renderer, scene, camera, controls;
  let moleculesGroup, electron, cone, coneMat, coneWireframeMat;
  let betaSlider, betaVal, beta = 0.8;
  let electronMat, electronWireframeMat;
  let particles = [];
  let polarisationArrows = [];

  function createWaterMolecule() {
    const mol = new THREE.Object3D();

    // Materials
    const oMat = new THREE.MeshPhongMaterial({ color: 0xff0d0d });
    const hMat = new THREE.MeshPhongMaterial({ color: 0xffffff });

    // Oxygen
    const oxygen = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), oMat);
    mol.add(oxygen);

    // Hydrogens
    const bondAngle = 104.5 * Math.PI / 180;
    const r = 1;
    const h1 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), hMat);
    const h2 = h1.clone();
    h1.position.set(r * Math.cos(-bondAngle/2), r * Math.sin(-bondAngle/2), 0);
    h2.position.set(r * Math.cos(bondAngle/2), r * Math.sin(bondAngle/2), 0);
    mol.add(h1, h2);

    return mol;
  }

  function spawnPhotonParticle() {
    const particleMat = new THREE.MeshBasicMaterial({ color: 0x33ccff, transparent: true, opacity: 0.9 });
    const particle = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), particleMat);
    particle.position.copy(electron.position);
    particle.life = 1.0;
    scene.add(particle);
    particles.push(particle);
  }

  function createPolarisationArrow(angle) {
    const dir = new THREE.Vector3(Math.cos(angle), Math.sin(angle), 0);
    const origin = new THREE.Vector3(0, 0, 0);
    const length = 2;
    const hex = 0x00ffff;
    const arrowHelper = new THREE.ArrowHelper(dir, origin, length, hex, 0.5, 0.3);
    return arrowHelper;
  }

  function openCherenkovSim() {
    if (document.querySelector('.draggable-window')) return;

    simWin = document.createElement('div');
    simWin.className = 'draggable-window';
    simWin.innerHTML = `
      <div class="title-bar">
        <span>⚛️ 3D Cherenkov Simulator</span>
        <button id="close3d">X</button>
      </div>
      <div id="threeContainer"></div>
      <div id="controlsPanel">
        Speed (β): <input type="range" id="betaSlider" min="0.5" max="0.99" step="0.01" value="0.8">
        <span id="betaVal">0.80</span>
        <label><input type="checkbox" id="wireframeElectron"> Wireframe Electron</label>
        <label><input type="checkbox" id="wireframeCone"> Wireframe Cone</label>
      </div>
    `;
    document.body.appendChild(simWin);

    // Close button
    simWin.querySelector('#close3d').onclick = () => {
      cleanup();
      simWin.remove();
    };

    // Draggable
    const titleBar = simWin.querySelector('.title-bar');
    let isDragging = false, offsetX = 0, offsetY = 0;
    titleBar.addEventListener('mousedown', e => {
      isDragging = true;
      offsetX = e.clientX - simWin.offsetLeft;
      offsetY = e.clientY - simWin.offsetTop;
    });
    document.addEventListener('mouseup', () => isDragging = false);
    document.addEventListener('mousemove', e => {
      if (isDragging) {
        simWin.style.left = Math.min(Math.max(0, e.clientX - offsetX), window.innerWidth - simWin.offsetWidth) + 'px';
        simWin.style.top = Math.min(Math.max(0, e.clientY - offsetY), window.innerHeight - simWin.offsetHeight) + 'px';
      }
    });

    // Three.js setup
    const container = simWin.querySelector('#threeContainer');
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(simWin.clientWidth, simWin.clientHeight - 60); // minus title bar + controls height approx
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 20, 60);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lighting
    const pointLight = new THREE.PointLight(0x00ffff, 1.2);
    pointLight.position.set(50, 50, 50);
    scene.add(pointLight);
    scene.add(new THREE.AmbientLight(0x222222));

    // Water molecules in 3D grid (7 x 5 x 5)
    moleculesGroup = new THREE.Group();
    const spacing = 5;
    for (let x = -3; x <= 3; x++) {
      for (let y = -2; y <= 2; y++) {
        for (let z = -2; z <= 2; z++) {
          const mol = createWaterMolecule();
          mol.position.set(x * spacing, y * spacing, z * spacing);
          moleculesGroup.add(mol);
        }
      }
    }
    scene.add(moleculesGroup);

    // Electron materials
    electronMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    electronWireframeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true });

    // Electron
    electron = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), electronMat);
    scene.add(electron);

    // Cone materials
    coneMat = new THREE.MeshPhongMaterial({ color: 0x3399ff, opacity: 0.6, transparent: true, side: THREE.DoubleSide });
    coneWireframeMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, opacity: 0.6, transparent: true });

    // Cherenkov cone
    const coneGeom = new THREE.ConeGeometry(1, 1, 32, 1, true);
    cone = new THREE.Mesh(coneGeom, coneMat);
    cone.rotation.z = Math.PI;
    cone.position.set(0, 0, 0);
    scene.add(cone);

    // Polarisation arrows on base circle (8 arrows spinning)
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      const arrow = createPolarisationArrow(angle);
      polarisationArrows.push(arrow);
      scene.add(arrow);
    }

    // Controls bindings
    betaSlider = simWin.querySelector('#betaSlider');
    betaVal = simWin.querySelector('#betaVal');
    betaSlider.value = beta;
    betaVal.textContent = beta.toFixed(2);
    betaSlider.oninput = () => {
      beta = parseFloat(betaSlider.value);
      betaVal.textContent = beta.toFixed(2);
    };

    const wireframeElectronCB = simWin.querySelector('#wireframeElectron');
    wireframeElectronCB.onchange = () => {
      electron.material = wireframeElectronCB.checked ? electronWireframeMat : electronMat;
    };
    const wireframeConeCB = simWin.querySelector('#wireframeCone');
    wireframeConeCB.onchange = () => {
      cone.material = wireframeConeCB.checked ? coneWireframeMat : coneMat;
    };

    window.addEventListener('resize', onWindowResize);

    animate();
  }

  let animationId;

  function animate() {
    animationId = requestAnimationFrame(animate);

    const time = performance.now() * 0.001;

    // Electron movement along X axis at speed proportional to beta
    electron.position.set(time * 10, 0, 0);

    // Cherenkov angle theta (if beta * n > 1)
    if (beta * n > 1) {
      const theta = Math.acos(1 / (beta * n));
      cone.rotation.set(theta, Math.PI / 2, Math.PI);

      // Scale cone to electron distance and angle
      const length = electron.position.x;
      const radius = length * Math.tan(theta);
      cone.scale.set(radius, length, radius);
      cone.position.copy(electron.position);

      cone.visible = true;

      // Polarisation arrows spin around cone base circle
      polarisationArrows.forEach((arrow, i) => {
        const spinSpeed = 2; // radians/sec
        const baseRadius = length * Math.tan(theta);
        const angle = (performance.now() * 0.002 + (i / polarisationArrows.length) * Math.PI * 2) * spinSpeed;
        arrow.position.set(
          electron.position.x,
          baseRadius * Math.cos(angle),
          baseRadius * Math.sin(angle)
        );
        arrow.setDirection(new THREE.Vector3(1, 0, 0));
      });
    } else {
      cone.visible = false;
      polarisationArrows.forEach(arrow => arrow.position.set(0, -9999, 0)); // hide offscreen
    }

    // Rotate molecules slightly to face electron, then gently return
    moleculesGroup.children.forEach(mol => {
      mol.lookAt(electron.position);
      mol.rotation.x += (-mol.rotation.x) * 0.05;
      mol.rotation.y += (-mol.rotation.y) * 0.05;
      mol.rotation.z += (-mol.rotation.z) * 0.05;
    });

    // Spawn photon particles trailing electron
    if (Math.random() < 0.1) spawnPhotonParticle();

    // Animate particles (fade out and move forward)
    particles.forEach((p, i) => {
      p.position.x += 0.15;
      p.material.opacity -= 0.01;
      p.life -= 0.01;
      if (p.life <= 0) {
        scene.remove(p);
        particles.splice(i, 1);
      }
    });

    controls.update();
    renderer.render(scene, camera);
  }

  function onWindowResize() {
    if (!renderer) return;
    const container = simWin.querySelector('#threeContainer');
    const width = container.clientWidth;
    const height = container.clientHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  }

  function cleanup() {
    cancelAnimationFrame(animationId);
    window.removeEventListener('resize', onWindowResize);
    if (renderer) {
      renderer.dispose();
      renderer.forceContextLoss();
      renderer.domElement = null;
      renderer = null;
    }
    if (scene) {
      scene.clear();
      scene = null;
    }
  }

  // Magnetic arrow background
  const canvas = document.getElementById('arrow-canvas');
  const ctx = canvas.getContext('2d');
  let mouse = { x: null, y: null };
  let arrows = [];
  const spacing = 20;
  const arrowSize = 6;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initArrows();
  });

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  class Arrow {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.angle = Math.PI / 2;
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.beginPath();
      ctx.moveTo(-arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 4, -arrowSize / 4);
      ctx.moveTo(arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 4, arrowSize / 4);
      const distance = this.getDistanceToMouse();
      const maxDist = 150;
      const clampedDist = Math.min(distance, maxDist);
      const ratio = 1 - clampedDist / maxDist;
      const red = Math.floor(ratio * 255);
      const green = Math.floor((1 - ratio) * 255);
      ctx.strokeStyle = `rgb(${red}, ${green}, 0)`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    update() {
      if (mouse.x === null || mouse.y === null) {
        this.angle += (Math.PI / 2 - this.angle) * 0.05;
        return;
      }
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      let distance = Math.sqrt(dx * dx + dy * dy);
      const maxDist = 150;
      if (distance < maxDist) {
        let targetAngle = Math.atan2(dy, dx);
        let influence = (maxDist - distance) / maxDist;
        this.angle += (targetAngle - this.angle) * influence * 0.3;
      } else {
        this.angle += (Math.PI / 2 - this.angle) * 0.05;
      }
    }

    getDistanceToMouse() {
      if (mouse.x === null || mouse.y === null) return Infinity;
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      return Math.sqrt(dx * dx + dy * dy);
    }
  }

  function initArrows() {
    arrows = [];
    for (let x = 0; x < canvas.width; x += spacing) {
      for (let y = 0; y < canvas.height; y += spacing) {
        arrows.push(new Arrow(x, y));
      }
    }
  }

  function animateArrows() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    arrows.forEach(a => {
      a.update();
      a.draw();
    });
    requestAnimationFrame(animateArrows);
  }

  initArrows();
  animateArrows();

  // Hook launch button
  document.getElementById('launchSimBtn').onclick = openCherenkovSim;
})();
</script>

    }

      if (mouse.x === null || mouse.y === null) return Infinity;
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      return Math.sqrt(dx * dx + dy * dy);
    }
  }

  function init() {
    arrows = [];
    for (let x = 0; x < canvas.width; x += spacing) {
      for (let y = 0; y < canvas.height; y += spacing) {
        arrows.push(new Arrow(x, y));
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    arrows.forEach(a => {
      a.update();
      a.draw();
    });
    requestAnimationFrame(animate);
  }

  init();
  animate();

  function openWindow(type, title, content) {
    const win = document.createElement('div');
    win.className = 'draggable-window ' + type;
    win.innerHTML = `
      <div class="title-bar">
        <span>${title}</span>
        <button onclick="this.closest('.draggable-window').remove()">X</button>
      </div>
      <div class="window-content">${content}</div>
    `;
    document.body.appendChild(win);

    const titleBar = win.querySelector('.title-bar');
    let isDragging = false, offsetX = 0, offsetY = 0;

    titleBar.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.clientX - win.offsetLeft;
      offsetY = e.clientY - win.offsetTop;
    });

    document.addEventListener('mouseup', () => isDragging = false);
    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.top = (e.clientY - offsetY) + 'px';
      }
    });
  }
</script>
