<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Year 10 USYD Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'VT323', monospace;
      font-size: 20px;
      background: #000;
      color: #00ffff;
      height: auto;
      overflow-y: auto;
    }

    #arrow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 40px;
      max-width: 800px;
      margin: auto;
    }

    h1, h2 {
      border-bottom: 1px solid #00ff00;
      padding-bottom: 5px;
    }

    .file-icon {
      margin-top: 10px;
      cursor: pointer;
      display: inline-block;
    }

    .file-icon img {
      width: 200px;
      border: 1px solid #00ff00;
    }

    .draggable-window {
      position: absolute;
      top: 120px;
      left: 120px;
      width: 500px;
      background: #000;
      border: 2px solid #00ff00;
      box-shadow: 0 0 15px #00ff00;
      z-index: 1000;
    }

    .title-bar {
      background: #003300;
      padding: 5px 10px;
      font-weight: bold;
      color: #00ff00;
      display: flex;
      justify-content: space-between;
      cursor: move;
    }

    .window-content {
      padding: 10px;
      max-height: 400px;
      overflow: auto;
    }

    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #00ff00;
      border-radius: 6px;
      border: 2px solid #003300;
      box-shadow: 0 0 5px #00ff00;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #33ff33;
    }
  </style>
</head>
<body>

<canvas id="arrow-canvas"></canvas>

<div class="content">
  <h1> Year 11 ANSTO's OPAL Reactor Cherenkov Radiation analysis </h1>
  <p> 
  </p>
<button onclick="openCherenkovSim()">⚛️ Launch Cherenkov Simulator</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

<script>
function openCherenkovSim() {
  if (document.querySelector('.draggable-window')) return;

  // Popup window
  const simWin = document.createElement('div');
  Object.assign(simWin.style, {
    position: 'fixed', top: '50px', left: '50px',
    width: '800px', height: '500px',
    background: '#000', border: '3px solid #00ffff',
    boxShadow: '0 0 20px #00ffff', zIndex: 9999,
    display: 'flex', flexDirection: 'column'
  });
  simWin.innerHTML = `
    <div class="title-bar" style="background:#001f2f;color:#0ff;padding:8px;cursor:move;display:flex;justify-content:space-between;align-items:center;font-family:VT323;">
      <span>⚛️ 3D Cherenkov Simulator</span>
      <button id="close3d" style="background:#0ff;color:#000;border:none;font-weight:bold;padding:4px 10px;cursor:pointer;">X</button>
    </div>
    <div style="flex:1;display:flex;position:relative;">
      <div id="threeContainer" style="flex:1;"></div>
      <div style="position:absolute;bottom:10px;left:10px;background:#002222;padding:8px;color:#0ff;font-family:VT323;">
        Speed (β): <input type="range" id="betaSlider" min="0.5" max="0.99" step="0.01" value="0.8">
        <span id="betaVal">0.80</span>
      </div>
    </div>`;
  document.body.appendChild(simWin);

  simWin.querySelector('#close3d').onclick = () => simWin.remove();

  // Draggable
  const title = simWin.querySelector('.title-bar');
  let dragging = false, dx=0, dy=0;
  title.addEventListener('mousedown', e => {
    dragging = true; dx = e.clientX - simWin.offsetLeft; dy = e.clientY - simWin.offsetTop;
  });
  document.addEventListener('mouseup', () => dragging = false);
  document.addEventListener('mousemove', e => {
    if (dragging) {
      simWin.style.left = Math.max(0, Math.min(window.innerWidth - simWin.offsetWidth, e.clientX - dx)) + 'px';
      simWin.style.top = Math.max(0, Math.min(window.innerHeight - simWin.offsetHeight, e.clientY - dy)) + 'px';
    }
  });

  // Three.js setup
  const container = simWin.querySelector('#threeContainer');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(0, 20, 60);
  new THREE.OrbitControls(camera, renderer.domElement);

  const light = new THREE.PointLight(0x00ffff, 1.2);
  light.position.set(50, 50, 50);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x222222));

  // Water molecules
  const molecules = new THREE.Group();
  const oMat = new THREE.MeshPhongMaterial({ color: 0xff0d0d });
  const hMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
  for (let i = -3; i <= 3; i++) {
    for (let j = -2; j <= 2; j++) {
      const mol = new THREE.Object3D();
      const ox = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), oMat);
      mol.add(ox);
      const bondAngle = 104.5 * Math.PI / 180;
      const r = 1;
      const h1 = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), hMat);
      const h2 = h1.clone();
      h1.position.set(r * Math.cos(-bondAngle/2), r * Math.sin(-bondAngle/2), 0);
      h2.position.set(r * Math.cos(bondAngle/2), r * Math.sin(bondAngle/2), 0);
      mol.add(h1, h2);
      mol.position.set(i * 6, j * 6, 0);
      molecules.add(mol);
    }
  }
  scene.add(molecules);

  // Electron
  const electron = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
  scene.add(electron);

  // Cherenkov cone
  const coneGeom = new THREE.ConeGeometry(1, 1, 32, 1, true);
  const coneMat = new THREE.MeshPhongMaterial({ color: 0x3399ff, opacity: 0.6, transparent: true, side: THREE.DoubleSide });
  const cone = new THREE.Mesh(coneGeom, coneMat);
  cone.rotation.z = Math.PI;
  cone.position.set(0,0,0);
  scene.add(cone);

  // Slider
  const betaSlider = simWin.querySelector('#betaSlider');
  const betaVal = simWin.querySelector('#betaVal');
  let beta = parseFloat(betaSlider.value);
  betaSlider.oninput = () => beta = parseFloat(betaSlider.value), betaVal.textContent = beta.toFixed(2);

  window.addEventListener('resize', () => {
    renderer.setSize(container.clientWidth, container.clientHeight);
    camera.aspect = container.clientWidth/container.clientHeight;
    camera.updateProjectionMatrix();
  });

  let startTime = performance.now();
  const n = 1.33;

  function animate() {
    const t = (performance.now() - startTime) * 0.001;
    electron.position.x = t * 10;
    electron.position.y = 0;
    electron.position.z = 0;

    const v = beta;
    const theta = Math.acos(1 / (beta * n));
    cone.rotation.y = Math.PI / 2;
    cone.rotation.x = theta;

    const length = electron.position.x;
    cone.scale.set( length * Math.tan(theta), length, length * Math.tan(theta) );
    cone.position.copy(electron.position);

    molecules.children.forEach(mol => {
      mol.lookAt(electron.position);
      mol.rotation.x += ( -mol.rotation.x ) * 0.05;
    });

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  animate();
}
</script>

</div>

<script>
  const canvas = document.getElementById('arrow-canvas');
  const ctx = canvas.getContext('2d');
  let mouse = { x: null, y: null };
  let arrows = [];
  const spacing = 20;
  const arrowSize = 6;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    init();
  });

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  class Arrow {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.angle = Math.PI / 2;
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.beginPath();
      ctx.moveTo(-arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 4, -arrowSize / 4);
      ctx.moveTo(arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 4, arrowSize / 4);
      const distance = this.getDistanceToMouse();
      const maxDist = 150;
      const clampedDist = Math.min(distance, maxDist);
      const ratio = 1 - clampedDist / maxDist;
      const red = Math.floor(ratio * 255);
      const green = Math.floor((1 - ratio) * 255);
      ctx.strokeStyle = `rgb(${red}, ${green}, 0)`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    update() {
      if (mouse.x === null || mouse.y === null) {
        this.angle += (Math.PI / 2 - this.angle) * 0.05;
        return;
      }
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      let distance = Math.sqrt(dx * dx + dy * dy);
      const maxDist = 150;
      if (distance < maxDist) {
        let targetAngle = Math.atan2(dy, dx);
        let influence = (maxDist - distance) / maxDist;
        this.angle += (targetAngle - this.angle) * influence * 0.3;
      } else {
        this.angle += (Math.PI / 2 - this.angle) * 0.05;
      }
    }

    getDistanceToMouse() {
      if (mouse.x === null || mouse.y === null) return Infinity;
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      return Math.sqrt(dx * dx + dy * dy);
    }
  }

  function init() {
    arrows = [];
    for (let x = 0; x < canvas.width; x += spacing) {
      for (let y = 0; y < canvas.height; y += spacing) {
        arrows.push(new Arrow(x, y));
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    arrows.forEach(a => {
      a.update();
      a.draw();
    });
    requestAnimationFrame(animate);
  }

  init();
  animate();

  function openWindow(type, title, content) {
    const win = document.createElement('div');
    win.className = 'draggable-window ' + type;
    win.innerHTML = `
      <div class="title-bar">
        <span>${title}</span>
        <button onclick="this.closest('.draggable-window').remove()">X</button>
      </div>
      <div class="window-content">${content}</div>
    `;
    document.body.appendChild(win);

    const titleBar = win.querySelector('.title-bar');
    let isDragging = false, offsetX = 0, offsetY = 0;

    titleBar.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.clientX - win.offsetLeft;
      offsetY = e.clientY - win.offsetTop;
    });

    document.addEventListener('mouseup', () => isDragging = false);
    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.top = (e.clientY - offsetY) + 'px';
      }
    });
  }
</script>
</body>
</html>
