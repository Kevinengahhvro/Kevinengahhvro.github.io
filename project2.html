<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Year 10 USYD Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'VT323', monospace;
      font-size: 20px;
      background: #000;
      color: #00ffff;
      height: auto;
      overflow-y: auto;
    }

    #arrow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 40px;
      max-width: 800px;
      margin: auto;
    }

    h1, h2 {
      border-bottom: 1px solid #00ff00;
      padding-bottom: 5px;
    }

    .file-icon {
      margin-top: 10px;
      cursor: pointer;
      display: inline-block;
    }

    .file-icon img {
      width: 200px;
      border: 1px solid #00ff00;
    }

    .draggable-window {
      position: absolute;
      top: 120px;
      left: 120px;
      width: 500px;
      background: #000;
      border: 2px solid #00ff00;
      box-shadow: 0 0 15px #00ff00;
      z-index: 1000;
    }

    .title-bar {
      background: #003300;
      padding: 5px 10px;
      font-weight: bold;
      color: #00ff00;
      display: flex;
      justify-content: space-between;
      cursor: move;
    }

    .window-content {
      padding: 10px;
      max-height: 400px;
      overflow: auto;
    }

    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #00ff00;
      border-radius: 6px;
      border: 2px solid #003300;
      box-shadow: 0 0 5px #00ff00;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #33ff33;
    }
  </style>
</head>
<body>

<canvas id="arrow-canvas"></canvas>

<div class="content">
  <h1> Year 11 ANSTO's OPAL Reactor Cherenkov Radiation analysis </h1>
  <p> 
  </p>
<button onclick="openCherenkovSim()">⚛️ Launch Cherenkov Simulator</button>
  
<script>
function openCherenkovSim() {
  const simWin = document.createElement('div');
  simWin.className = 'draggable-window';
  simWin.style.position = 'fixed';
  simWin.style.top = '0';
  simWin.style.left = '0';
  simWin.style.width = '100vw';
  simWin.style.height = '100vh';
  simWin.style.background = '#000';
  simWin.style.zIndex = '9999';
  simWin.style.border = '3px solid #00ffff';
  simWin.innerHTML = `
    <div class="title-bar" style="background:#001f2f; color:#00ffff; font-family:'VT323', monospace; display:flex; justify-content:space-between; align-items:center; padding:10px;">
      <span>Cherenkov Radiation Simulator</span>
      <button onclick="this.closest('.draggable-window').remove()" style="background:#00ffff; color:#000; border:none; padding:4px 10px; font-weight:bold;">X</button>
    </div>
    <canvas id="cherenkovCanvas" style="display:block; width:100%; height:calc(100% - 40px);"></canvas>
  `;
  document.body.appendChild(simWin);

  const canvas = document.getElementById('cherenkovCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight - 40;

  const waterMolecules = [];
  const electrons = [];

  const spacing = 120;
  for (let x = 60; x < canvas.width; x += spacing) {
    for (let y = 60; y < canvas.height; y += spacing) {
      waterMolecules.push({ x, y, angle: 0, originalAngle: 0 });
    }
  }

  canvas.addEventListener('click', (e) => {
    electrons.push({
      x: e.clientX,
      y: e.clientY,
      vx: 10,
      alpha: 1,
      trail: []
    });
  });

  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = electrons.length - 1; i >= 0; i--) {
      const el = electrons[i];
      el.trail.push({ x: el.x, y: el.y, alpha: el.alpha });
      if (el.trail.length > 20) el.trail.shift();

      for (let j = 0; j < el.trail.length; j++) {
        const t = el.trail[j];
        ctx.beginPath();
        ctx.fillStyle = `rgba(0,200,255,${t.alpha * (j / el.trail.length)})`;
        ctx.arc(t.x, t.y, 5 * (j / el.trail.length), 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      const gradient = ctx.createRadialGradient(el.x, el.y, 0, el.x, el.y, 20);
      gradient.addColorStop(0, `rgba(0,200,255,${el.alpha})`);
      gradient.addColorStop(1, `rgba(0,0,255,0)`);
      ctx.fillStyle = gradient;
      ctx.arc(el.x, el.y, 8, 0, Math.PI * 2);
      ctx.fill();

      el.x += el.vx;
      el.alpha -= 0.005;

      if (el.alpha <= 0 || el.x > canvas.width + 30) {
        electrons.splice(i, 1);
      }
    }

    waterMolecules.forEach(mol => {
      let facing = false;
      for (const el of electrons) {
        const dx = el.x - mol.x;
        const dy = el.y - mol.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 180) {
          mol.angle = Math.atan2(dy, dx);
          facing = true;
          break;
        }
      }
      if (!facing) {
        mol.angle += (mol.originalAngle - mol.angle) * 0.1;
      }

      ctx.save();
      ctx.translate(mol.x, mol.y);
      ctx.rotate(mol.angle);

      // === Parameters for molecule ===
      const bondLength = 20; // scaled length for bonds (~0.96 Angstrom)
      const bondAngleDeg = 104.5;
      const bondAngleRad = bondAngleDeg * Math.PI / 180;

      // Positions of hydrogens relative to oxygen at (0,0)
      const h1x = bondLength * Math.cos(-bondAngleRad / 2);
      const h1y = bondLength * Math.sin(-bondAngleRad / 2);
      const h2x = bondLength * Math.cos(bondAngleRad / 2);
      const h2y = bondLength * Math.sin(bondAngleRad / 2);

      // === Draw dipole arrow ===
      const midX = (h1x + h2x) / 2;
      const midY = (h1y + h2y) / 2;
      const arrowLength = Math.sqrt(midX * midX + midY * midY) * 2.5;

      ctx.save();
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(0, 255, 255, 0.7)';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(0, 255, 255, 0.5)';
      ctx.shadowBlur = 8;
      ctx.moveTo(0, 0);
      ctx.lineTo(midX * 2.5, midY * 2.5);
      ctx.stroke();

      // Arrowhead
      const angle = Math.atan2(midY, midX);
      const arrowHeadSize = 8;
      ctx.beginPath();
      ctx.moveTo(midX * 2.5, midY * 2.5);
      ctx.lineTo(
        midX * 2.5 - arrowHeadSize * Math.cos(angle - Math.PI / 6),
        midY * 2.5 - arrowHeadSize * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        midX * 2.5 - arrowHeadSize * Math.cos(angle + Math.PI / 6),
        midY * 2.5 - arrowHeadSize * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fillStyle = 'rgba(0, 255, 255, 0.7)';
      ctx.fill();
      ctx.restore();

      // Oxygen atom (red)
      ctx.beginPath();
      ctx.fillStyle = '#FF0D0D'; // bright red for oxygen
      ctx.shadowColor = 'rgba(255, 13, 13, 0.8)';
      ctx.shadowBlur = 15;
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Bonds (light gray)
      ctx.beginPath();
      ctx.strokeStyle = '#AAAAAA';
      ctx.lineWidth = 4;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.3)';
      ctx.shadowBlur = 6;
      ctx.moveTo(0, 0);
      ctx.lineTo(h1x, h1y);
      ctx.moveTo(0, 0);
      ctx.lineTo(h2x, h2y);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Hydrogen atoms (white)
      ctx.beginPath();
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
      ctx.shadowBlur = 12;
      ctx.arc(h1x, h1y, 8, 0, Math.PI * 2);
      ctx.arc(h2x, h2y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.restore();
    });

    requestAnimationFrame(draw);
  }

  draw();
}
</script>

</div>

<script>
  const canvas = document.getElementById('arrow-canvas');
  const ctx = canvas.getContext('2d');
  let mouse = { x: null, y: null };
  let arrows = [];
  const spacing = 20;
  const arrowSize = 6;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    init();
  });

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  class Arrow {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.angle = Math.PI / 2;
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.beginPath();
      ctx.moveTo(-arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 4, -arrowSize / 4);
      ctx.moveTo(arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 4, arrowSize / 4);
      const distance = this.getDistanceToMouse();
      const maxDist = 150;
      const clampedDist = Math.min(distance, maxDist);
      const ratio = 1 - clampedDist / maxDist;
      const red = Math.floor(ratio * 255);
      const green = Math.floor((1 - ratio) * 255);
      ctx.strokeStyle = `rgb(${red}, ${green}, 0)`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    update() {
      if (mouse.x === null || mouse.y === null) {
        this.angle += (Math.PI / 2 - this.angle) * 0.05;
        return;
      }
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      let distance = Math.sqrt(dx * dx + dy * dy);
      const maxDist = 150;
      if (distance < maxDist) {
        let targetAngle = Math.atan2(dy, dx);
        let influence = (maxDist - distance) / maxDist;
        this.angle += (targetAngle - this.angle) * influence * 0.3;
      } else {
        this.angle += (Math.PI / 2 - this.angle) * 0.05;
      }
    }

    getDistanceToMouse() {
      if (mouse.x === null || mouse.y === null) return Infinity;
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      return Math.sqrt(dx * dx + dy * dy);
    }
  }

  function init() {
    arrows = [];
    for (let x = 0; x < canvas.width; x += spacing) {
      for (let y = 0; y < canvas.height; y += spacing) {
        arrows.push(new Arrow(x, y));
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    arrows.forEach(a => {
      a.update();
      a.draw();
    });
    requestAnimationFrame(animate);
  }

  init();
  animate();

  function openWindow(type, title, content) {
    const win = document.createElement('div');
    win.className = 'draggable-window ' + type;
    win.innerHTML = `
      <div class="title-bar">
        <span>${title}</span>
        <button onclick="this.closest('.draggable-window').remove()">X</button>
      </div>
      <div class="window-content">${content}</div>
    `;
    document.body.appendChild(win);

    const titleBar = win.querySelector('.title-bar');
    let isDragging = false, offsetX = 0, offsetY = 0;

    titleBar.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.clientX - win.offsetLeft;
      offsetY = e.clientY - win.offsetTop;
    });

    document.addEventListener('mouseup', () => isDragging = false);
    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.top = (e.clientY - offsetY) + 'px';
      }
    });
  }
</script>
</body>
</html>
