<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Year 10 USYD Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'VT323', monospace;
      font-size: 20px;
      background: #000;
      color: #00ffff;
      height: auto;
      overflow-y: auto;
    }

    #arrow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      padding: 40px;
      max-width: 800px;
      margin: auto;
    }

    h1, h2 {
      border-bottom: 1px solid #00ff00;
      padding-bottom: 5px;
    }

    .file-icon {
      margin-top: 10px;
      cursor: pointer;
      display: inline-block;
    }

    .file-icon img {
      width: 200px;
      border: 1px solid #00ff00;
    }

    .draggable-window {
      position: absolute;
      top: 120px;
      left: 120px;
      width: 500px;
      background: #000;
      border: 2px solid #00ff00;
      box-shadow: 0 0 15px #00ff00;
      z-index: 1000;
    }

    .title-bar {
      background: #003300;
      padding: 5px 10px;
      font-weight: bold;
      color: #00ff00;
      display: flex;
      justify-content: space-between;
      cursor: move;
    }

    .window-content {
      padding: 10px;
      max-height: 400px;
      overflow: auto;
    }

    ::-webkit-scrollbar {
      width: 12px;
    }

    ::-webkit-scrollbar-track {
      background: #000;
    }

    ::-webkit-scrollbar-thumb {
      background: #00ff00;
      border-radius: 6px;
      border: 2px solid #003300;
      box-shadow: 0 0 5px #00ff00;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #33ff33;
    }
  </style>
</head>
<body>

<canvas id="arrow-canvas"></canvas>

<div class="content">
  <h1> Year 11 ANSTO's OPAL Reactor Cherenkov Radiation analysis </h1>
  <p> 
  </p>
<button onclick="openCherenkovSim()">⚛️ Launch Cherenkov Simulator</button>
  

<button onclick="openCherenkovSim()" style="margin: 20px; font-size: 20px;">⚛️ Launch Cherenkov Simulator</button>

<script>
function openCherenkovSim() {
  if (document.querySelector('.draggable-window')) return;

  const simWin = document.createElement('div');
  simWin.className = 'draggable-window';
  simWin.innerHTML = `
    <div class="title-bar">
      <span>⚡ Cherenkov Radiation Simulator</span>
      <button onclick="this.closest('.draggable-window').remove()" style="background:#00ffff;color:#000;border:none;padding:4px 10px;font-weight:bold;">X</button>
    </div>
    <div class="window-content">
      <canvas id="cherenkovCanvas"></canvas>
      <div class="controls">
        Speed: <input type="range" id="speedSlider" min="2" max="20" value="8">
      </div>
    </div>
  `;
  document.body.appendChild(simWin);

  // Make draggable
  const titleBar = simWin.querySelector('.title-bar');
  let isDragging = false, offsetX = 0, offsetY = 0;
  titleBar.addEventListener('mousedown', e => {
    isDragging = true;
    offsetX = e.clientX - simWin.offsetLeft;
    offsetY = e.clientY - simWin.offsetTop;
  });
  document.addEventListener('mousemove', e => {
    if (isDragging) {
      simWin.style.left = `${e.clientX - offsetX}px`;
      simWin.style.top = `${e.clientY - offsetY}px`;
    }
  });
  document.addEventListener('mouseup', () => isDragging = false);

  const canvas = simWin.querySelector('#cherenkovCanvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = simWin.clientWidth;
    canvas.height = simWin.clientHeight - titleBar.offsetHeight;
  }
  resizeCanvas();
  new ResizeObserver(resizeCanvas).observe(simWin);

  const waterMolecules = [];
  const electrons = [];
  const spacing = 100;

  for (let x = 50; x < canvas.width; x += spacing) {
    for (let y = 50; y < canvas.height; y += spacing) {
      waterMolecules.push({ x, y, angle: 0, originalAngle: 0 });
    }
  }

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const speed = parseFloat(document.getElementById('speedSlider').value);
    electrons.push({ 
      startX: e.clientX - rect.left, 
      x: e.clientX - rect.left, 
      y: e.clientY - rect.top, 
      vx: speed, 
      alpha: 1, 
      trail: [], 
      coneAngle: Math.PI / 8 
    });
  });

  function drawCone(el) {
    const dist = el.x - el.startX;
    const coneLength = dist;
    const coneWidth = coneLength * Math.tan(el.coneAngle);

    ctx.save();
    ctx.translate(el.startX, el.y);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(coneLength, -coneWidth);
    ctx.lineTo(coneLength, coneWidth);
    ctx.closePath();

    const grad = ctx.createLinearGradient(0, 0, coneLength, 0);
    grad.addColorStop(0, 'rgba(0,200,255,0.6)');
    grad.addColorStop(1, 'rgba(0,100,255,0)');
    ctx.fillStyle = grad;
    ctx.shadowColor = 'rgba(0,200,255,0.4)';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.restore();
  }

  function drawElectronTrail(el) {
    el.trail.push({ x: el.x, y: el.y, alpha: el.alpha });
    if (el.trail.length > 50) el.trail.shift();

    el.trail.forEach(t => {
      const grad = ctx.createRadialGradient(t.x, t.y, 0, t.x, t.y, 10);
      grad.addColorStop(0, `rgba(0,200,255,${t.alpha * 0.5})`);
      grad.addColorStop(1, `rgba(0,0,255,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(t.x, t.y, 6, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawWaterMolecule(mol, electrons) {
    let facing = false;
    for (const el of electrons) {
      const dx = el.x - mol.x;
      const dy = el.y - mol.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        mol.angle = Math.atan2(dy, dx);
        facing = true;
        break;
      }
    }
    if (!facing) mol.angle += (mol.originalAngle - mol.angle) * 0.1;

    ctx.save();
    ctx.translate(mol.x, mol.y);
    ctx.rotate(mol.angle);

    // Oxygen (red)
    ctx.fillStyle = 'red';
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, 2 * Math.PI);
    ctx.fill();

    // Hydrogens (white)
    ctx.fillStyle = 'white';
    const bondLength = 15;
    const bondAngle = 52.25 * (Math.PI / 180);
    for (let sign of [-1, 1]) {
      const angle = bondAngle * sign;
      const hx = Math.cos(angle) * bondLength;
      const hy = Math.sin(angle) * bondLength;
      ctx.beginPath();
      ctx.arc(hx, hy, 4, 0, 2 * Math.PI);
      ctx.fill();
    }
    ctx.restore();
  }

  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = electrons.length - 1; i >= 0; i--) {
      const el = electrons[i];
      drawCone(el);
      drawElectronTrail(el);
      el.x += el.vx;
      el.alpha -= 0.004;
      if (el.alpha <= 0 || el.x > canvas.width + 50) {
        electrons.splice(i, 1);
      }
    }

    for (const mol of waterMolecules) {
      drawWaterMolecule(mol, electrons);
    }

    requestAnimationFrame(update);
  }

  update();
}
</script>
  
  <p><a href="projects.html">← Back to Projects</a></p>
</div>

<script>
  const canvas = document.getElementById('arrow-canvas');
  const ctx = canvas.getContext('2d');
  let mouse = { x: null, y: null };
  let arrows = [];
  const spacing = 20;
  const arrowSize = 6;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    init();
  });

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  class Arrow {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.angle = Math.PI / 2;
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.beginPath();
      ctx.moveTo(-arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 4, -arrowSize / 4);
      ctx.moveTo(arrowSize / 2, 0);
      ctx.lineTo(arrowSize / 4, arrowSize / 4);
      const distance = this.getDistanceToMouse();
      const maxDist = 150;
      const clampedDist = Math.min(distance, maxDist);
      const ratio = 1 - clampedDist / maxDist;
      const red = Math.floor(ratio * 255);
      const green = Math.floor((1 - ratio) * 255);
      ctx.strokeStyle = `rgb(${red}, ${green}, 0)`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    update() {
      if (mouse.x === null || mouse.y === null) {
        this.angle += (Math.PI / 2 - this.angle) * 0.05;
        return;
      }
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      let distance = Math.sqrt(dx * dx + dy * dy);
      const maxDist = 150;
      if (distance < maxDist) {
        let targetAngle = Math.atan2(dy, dx);
        let influence = (maxDist - distance) / maxDist;
        this.angle += (targetAngle - this.angle) * influence * 0.3;
      } else {
        this.angle += (Math.PI / 2 - this.angle) * 0.05;
      }
    }

    getDistanceToMouse() {
      if (mouse.x === null || mouse.y === null) return Infinity;
      let dx = mouse.x - this.x;
      let dy = mouse.y - this.y;
      return Math.sqrt(dx * dx + dy * dy);
    }
  }

  function init() {
    arrows = [];
    for (let x = 0; x < canvas.width; x += spacing) {
      for (let y = 0; y < canvas.height; y += spacing) {
        arrows.push(new Arrow(x, y));
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    arrows.forEach(a => {
      a.update();
      a.draw();
    });
    requestAnimationFrame(animate);
  }

  init();
  animate();

  function openWindow(type, title, content) {
    const win = document.createElement('div');
    win.className = 'draggable-window ' + type;
    win.innerHTML = `
      <div class="title-bar">
        <span>${title}</span>
        <button onclick="this.closest('.draggable-window').remove()">X</button>
      </div>
      <div class="window-content">${content}</div>
    `;
    document.body.appendChild(win);

    const titleBar = win.querySelector('.title-bar');
    let isDragging = false, offsetX = 0, offsetY = 0;

    titleBar.addEventListener('mousedown', (e) => {
      isDragging = true;
      offsetX = e.clientX - win.offsetLeft;
      offsetY = e.clientY - win.offsetTop;
    });

    document.addEventListener('mouseup', () => isDragging = false);
    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.top = (e.clientY - offsetY) + 'px';
      }
    });
  }
</script>
</body>
</html>
